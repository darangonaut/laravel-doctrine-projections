name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Testbench pulls laravel/framework, which *replaces* the
        # illuminate/* packages, so pinning both at once is unsatisfiable.
        # The matrix therefore pins the framework and the matching
        # testbench rather than the individual illuminate components.
        # Laravel 11 is absent on purpose: every 11.x release is blocked by
        # security advisories, so Composer refuses to install it at all.
        include:
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: Pin Laravel
        run: >
          composer require --dev --no-update --no-interaction
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/phpunit

      - name: Style
        run: vendor/bin/pint --test

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      # level max, no baseline, no ignores — a package selling type safety
      # should hold itself to it
      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress
